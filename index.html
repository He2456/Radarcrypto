<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار باينانس المضمون - العملات البديلة</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: #181a20;
            --text-color: #eaecef;
            --accent-color: #f0b90b;
            --green: #0ecb81;
            --border-color: #2b3139;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        header {
            text-align: center;
            padding: 15px;
            background-color: var(--card-bg);
            border-radius: 10px;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--accent-color);
        }

        h1 { margin: 0; color: var(--accent-color); font-size: 22px; }
        p { color: #848e9c; margin: 5px 0 0 0; font-size: 14px; }

        .btn-refresh {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid var(--border-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .token-name { font-weight: bold; font-size: 18px; color: #fff; }
        .binance-badge {
            background-color: #2b3139;
            color: var(--accent-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            font-size: 14px;
        }

        .stat-label { color: #848e9c; }
        .stat-value { font-weight: 500; }

        .price-up { color: var(--green); font-weight: bold; }

        .trade-btn {
            display: block;
            text-align: center;
            background-color: var(--accent-color);
            color: #000;
            text-decoration: none;
            padding: 8px;
            border-radius: 5px;
            margin-top: 12px;
            font-weight: bold;
            font-size: 13px;
        }

        #status {
            text-align: center;
            font-size: 14px;
            color: var(--accent-color);
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>• رادار باينانس المضاد للحظر (API) •</h1>
        <p>نسخة معالجة للأمان لضمان سحب جميع العملات البديلة فوراً على الجوال</p>
        <button class="btn-refresh" onclick="fetchBinanceData()">تحديث يدوي فوراً 🔄</button>
    </header>

    <div id="status">جاري الاتصال الآمن وسحب العملات...</div>
    <div class="grid" id="token-grid"></div>

    <script>
        // قائمة استبعاد العملات الكبيرة والمستقرة تماماً
        const BLACKLIST_BASE = [
            'BTC', 'ETH', 'BNB', 'SOL', 'XRP', 'ADA', 'DOGE', 'AVAX', 'LINK', 'DOT', 'MATIC', 'NEAR', 'LTC',
            'USDT', 'USDC', 'BUSD', 'FDUSD', 'TUSD', 'DAI', 'EUR', 'TRY', 'GBP'
        ];

        const grid = document.getElementById('token-grid');
        const statusDiv = document.getElementById('status');

        async function fetchBinanceData() {
            statusDiv.innerHTML = "🔄 جاري جلب صفقات باينانس الآن...";
            statusDiv.style.color = var(--accent-color);
            
            try {
                // استخدمنا هنا بروكاسي وسيط مشهور جداً لتخطي حظر المتصفحات (CORS AllOrigins)
                const targetUrl = 'https://api.binance.com/api/v3/ticker/24hr';
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('فشل البروكسي في جلب البيانات');
                
                const jsonWrapper = await response.json();
                // فك الحزمة القادمة من البروكسي وتحويلها لمصفوفة باينانس
                const data = JSON.parse(jsonWrapper.contents);
                
                let activeTokens = [];

                data.forEach(market => {
                    const symbol = market.symbol;
                    
                    if (!symbol || !symbol.endsWith('USDT')) return;
                    
                    const baseAsset = symbol.replace('USDT', '');
                    
                    if (BLACKLIST_BASE.includes(baseAsset)) return;

                    const lastPrice = parseFloat(market.lastPrice);
                    const priceChangePercent = parseFloat(market.priceChangePercent);
                    const quoteVolume = parseFloat(market.quoteVolume);

                    // شروط خفيفة جداً لضمان الامتلاء (حجم > 50 ألف دولار | صعود فوق الصفر | سعر رخيص)
                    if (quoteVolume > 50000 && priceChangePercent > 0.0 && lastPrice < 5.0) {
                        activeTokens.push({
                            symbol: baseAsset,
                            price: lastPrice,
                            change: priceChangePercent,
                            volume: quoteVolume
                        });
                    }
                });

                // ترتيب من الأعلى صعوداً
                activeTokens.sort((a, b) => b.change - a.change);

                renderGrid(activeTokens);
                
                const now = new Date();
                statusDiv.innerHTML = `🟢 تم تحديث ${activeTokens.length} عملة بديلة بنجاح! التحديث القادم تلقائي بعد ثوانٍ 🚀`;
                statusDiv.style.color = "#0ecb81";

            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = "🔴 عطل في الشبكة أو جاري كسر حظر CORS.. اضغط زر التحديث اليدوي بالأعلى";
                statusDiv.style.color = "#f6465d";
            }
        }

        function renderGrid(tokens) {
            if (tokens.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #848e9c; padding: 30px;">
                    🔍 لم يتم العثور على عملات تطابق الشروط حالياً.
                </div>`;
                return;
            }

            grid.innerHTML = '';
            tokens.forEach(token => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="token-name">${token.symbol}/USDT</span>
                        <span class="binance-badge">باينانس فوري</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">السعر:</span>
                        <span class="stat-value">${token.price < 0.01 ? token.price.toFixed(6) : token.price.toFixed(4)} $</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">التغير:</span>
                        <span class="stat-value price-up">${token.change.toFixed(2)}%+</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">السيولة (24h):</span>
                        <span class="stat-value" style="color: #fff;">$${token.volume.toLocaleString(undefined, {maximumFractionDigits: 0})}</span>
                    </div>
                    <a href="https://www.binance.com/ar/trade/${token.symbol}_USDT" target="_blank" class="trade-btn">تداول الآن</a>
                `;
                grid.appendChild(card);
            });
        }

        // تشغيل فوري
        fetchBinanceData();

        // تحديث مستمر كل 10 ثوانٍ
        setInterval(fetchBinanceData, 10000);
    </script>
</body>
</html>
