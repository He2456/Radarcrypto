<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار باينانس الفوري للعملات البديلة</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: #181a20;
            --text-color: #eaecef;
            --accent-color: #f0b90b;
            --green: #0ecb81;
            --border-color: #2b3139;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        header {
            text-align: center;
            padding: 15px;
            background-color: var(--card-bg);
            border-radius: 10px;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--accent-color);
        }

        h1 { margin: 0; color: var(--accent-color); font-size: 22px; }
        p { color: #848e9c; margin: 5px 0 0 0; font-size: 14px; }

        .filters-summary {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .badge {
            background: #2b3139;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 11px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid var(--border-color);
            position: relative;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .token-name { font-weight: bold; font-size: 18px; color: #fff; }
        .binance-badge {
            background-color: #2b3139;
            color: var(--accent-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            font-size: 14px;
        }

        .stat-label { color: #848e9c; }
        .stat-value { font-weight: 500; }

        .price-up { color: var(--green); font-weight: bold; }

        .trade-btn {
            display: block;
            text-align: center;
            background-color: var(--accent-color);
            color: #000;
            text-decoration: none;
            padding: 8px;
            border-radius: 5px;
            margin-top: 12px;
            font-weight: bold;
            font-size: 13px;
            transition: background 0.2s;
        }

        .trade-btn:hover { background-color: #f8d155; }

        #status {
            text-align: center;
            font-size: 15px;
            color: var(--accent-color);
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>• رادار باينانس الفوري للعملات البديلة •</h1>
        <p>مراقبة حية فائقة الحساسية لاصطياد بدايات حركة صعود العملات البديلة</p>
        <div class="filters-summary">
            <span class="badge">❌ مستبعد: الكبيرة (BTC, ETH, BNB)</span>
            <span class="badge">❌ مستبعد: شبه رئيسية (SOL, XRP...)</span>
            <span class="badge">❌ مستبعد: المستقرة (USDT, USDC...)</span>
            <span class="badge">🔥 الشروط الخفيفة: حجم > $100K | صعود > 0.5%+</span>
        </div>
    </header>

    <div id="status">جاري فتح بث باينانس بالملي ثانية...</div>
    <div class="grid" id="token-grid"></div>

    <script>
        // قائمة استبعاد العملات الكبيرة والمستقرة لمنع تشتيت الشاشة
        const BLACKLIST_BASE = [
            'BTC', 'ETH', 'BNB', 'SOL', 'XRP', 'ADA', 'DOGE', 'AVAX', 'LINK', 'DOT', 'MATIC', 'NEAR', 'LTC',
            'USDT', 'USDC', 'BUSD', 'FDUSD', 'TUSD', 'DAI', 'EUR', 'TRY', 'GBP'
        ];

        const grid = document.getElementById('token-grid');
        const statusDiv = document.getElementById('status');
        
        let activeTokens = {};

        // الاتصال المباشر بالبث المباشر لباينانس لحركات السوق اللحظية
        const wsUrl = "wss://stream.binance.com:9443/ws/!ticker@arr";
        const ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            statusDiv.innerHTML = "🟢 متصل بالبث الفوري.. الرادار شغال ويلقط أي حركة سيولة الآن 🚀";
            statusDiv.style.color = "#0ecb81";
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            data.forEach(market => {
                const symbol = market.s;
                
                // تم تعديلها هنا برمجياً لتكون التسمية صحيحة للمتصفح (endsWith) بدلاً من (endswith)
                if (!symbol.endsWith('USDT')) return;
                
                const baseAsset = symbol.replace('USDT', '');
                
                // تطبيق فلتر الاستبعاد الفوري للعملات غير المستهدفة
                if (BLACKLIST_BASE.includes(baseAsset)) return;

                const lastPrice = parseFloat(market.c);
                const priceChangePercent = parseFloat(market.P); 
                const quoteVolume = parseFloat(market.q); 

                // الفلاتر الخفيفة لاصطياد العملات: حجم التداول فوق 100 ألف دولار، ارتفاع فوق 0.5%، وسعر أقل من 3 دولار
                if (quoteVolume > 100000 && priceChangePercent > 0.5 && lastPrice < 3.0) {
                    activeTokens[baseAsset] = {
                        symbol: baseAsset,
                        price: lastPrice,
                        change: priceChangePercent,
                        volume: quoteVolume
                    };
                } else {
                    if (activeTokens[baseAsset]) {
                        delete activeTokens[baseAsset];
                    }
                }
            });

            renderGrid();
        };

        function renderGrid() {
            const sortedTokens = Object.values(activeTokens).sort((a, b) => b.change - a.change);
            
            if (sortedTokens.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #848e9c; padding: 30px;">
                    🔍 الرادار يمسح الصفقات الحية.. بانتظار تطابق الشروط الخفيفة جداً لعرض العملات البديلة...
                </div>`;
                return;
            }

            grid.innerHTML = '';
            sortedTokens.forEach(token => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="token-name">${token.symbol}/USDT</span>
                        <span class="binance-badge">باينانس فوري</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">السعر الحالي:</span>
                        <span class="stat-value">${token.price < 0.01 ? token.price.toFixed(6) : token.price.toFixed(4)} $</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">الارتفاع اللحظي:</span>
                        <span class="stat-value price-up">${token.change.toFixed(2)}%+</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">حجم التداول (24h):</span>
                        <span class="stat-value" style="color: #fff;">$${token.volume.toLocaleString(undefined, {maximumFractionDigits: 0})}</span>
                    </div>
                    <a href="https://www.binance.com/ar/trade/${token.symbol}_USDT" target="_blank" class="trade-btn">انتقل للتداول فوراً</a>
                `;
                grid.appendChild(card);
            });
        }

        ws.onclose = () => {
            statusDiv.innerHTML = "🔴 انقطع البث.. جاري إعادة الاتصال التلقائي بالخادم...";
            statusDiv.style.color = "#f6465d";
        };
    </script>
</body>
</html>
